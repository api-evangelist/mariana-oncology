aid: mariana-oncology
name: Mariana Oncology
description: 'Mariana Oncology, a Novartis company, is a Watertown, Massachusetts biotechnology
  company developing precision radioligand therapies (RLTs) — targeted radiopharmaceuticals
  that deliver alpha- and beta-emitting radioisotopes selectively to tumor cells while
  sparing healthy tissue. Its pipeline pursues solid-tumor targets including DLL3-expressing
  small cell lung cancer (MC-339), alongside breast and prostate programs, and it operates
  a Radioligand Therapy Innovation Center of Excellence for radiochemistry, isotope handling
  and clinical supply. Founded in 2020 and acquired by Novartis in May 2024, Mariana Oncology
  is a therapeutics developer, not a software vendor: it publishes no developer program,
  no public API, and no machine-readable interface of any kind.'
